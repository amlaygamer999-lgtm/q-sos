<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة المتسلل (Imposter)</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        :root {
            --bg-color: #12102A;
            --accent-pink: #FF3366;
            --accent-blue: #00E5FF;
            --card-bg: #1E1A45;
            --text-light: #FFFFFF;
        }
        
        body {
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .view-container {
            display: none; /* يتم إظهاره عبر الجافاسكربت */
            width: 100%;
            height: 100vh;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }

        /* تنسيقات عامة للأزرار والحقول */
        button {
            background: linear-gradient(45deg, var(--accent-pink), #ff6b6b);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.5rem;
            font-family: inherit;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(255, 51, 102, 0.3);
            transition: transform 0.2s;
            margin: 10px;
        }
        button:active { transform: scale(0.95); }
        button.alt-btn { background: linear-gradient(45deg, var(--accent-blue), #00b4d8); box-shadow: 0 10px 20px rgba(0, 229, 255, 0.3); color: #000; }

        input {
            width: 90%;
            max-width: 400px;
            padding: 15px;
            margin: 10px 0;
            font-size: 1.2rem;
            border-radius: 15px;
            border: 2px solid var(--accent-blue);
            background: var(--card-bg);
            color: white;
            font-family: inherit;
            text-align: center;
        }

        /* تنسيقات الشاشة الرئيسية (Host) */
        #qr-container { display: none; width: 100%; height: 100%; position: relative; }
        .big-qr-box { display: flex; flex-direction: column; align-items: center; margin-top: 5vh; }
        .big-qr-box h1 { font-size: 3rem; margin-bottom: 20px; text-shadow: 0 0 10px var(--accent-pink); }
        #qrcode-players { background: white; padding: 15px; border-radius: 20px; box-shadow: 0 0 30px var(--accent-pink); }
        
        .small-qr-box { position: absolute; bottom: 30px; right: 30px; display: flex; flex-direction: column; align-items: center; }
        .small-qr-box p { margin: 5px 0; font-size: 1.2rem; font-weight: bold; color: var(--accent-blue); }
        #qrcode-admin { background: white; padding: 10px; border-radius: 10px; border: 4px solid var(--accent-blue); }

        #host-game-area { display: none; width: 100%; max-width: 1200px; }
        .answers-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-top: 30px; }
        .answer-card { background: var(--card-bg); padding: 20px; border-radius: 15px; border-bottom: 5px solid var(--accent-blue); font-size: 1.5rem; }
        .player-name-badge { font-weight: bold; color: var(--accent-pink); font-size: 1.8rem; margin-bottom: 10px; display: block; }

        /* تنسيقات الجوال (Player & Admin) */
        .mobile-card { background: var(--card-bg); padding: 30px; border-radius: 20px; width: 100%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .mobile-card h2 { color: var(--accent-blue); margin-top: 0; }
        
        .status-msg { font-size: 1.5rem; font-weight: bold; color: var(--accent-pink); margin: 20px 0; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

    </style>
</head>
<body>

    <!-- ==================== 1. شاشة العرض الرئيسية (Host) ==================== -->
    <div id="host-view" class="view-container">
        <div id="start-screen">
            <h1 style="font-size: 4rem; color: var(--accent-pink); margin-bottom: 10px;">لعبة المُتسلل 🕵️‍♂️</h1>
            <p style="font-size: 1.5rem; margin-bottom: 40px;">اكتشف مين اللي يجاوب على سؤال مختلف!</p>
            <button onclick="startHost()">ابـدأ اللعبـة الآن</button>
        </div>

        <div id="qr-container">
            <div class="big-qr-box">
                <h1>امسح الباركود للدخول!</h1>
                <div id="qrcode-players"></div>
                <h2 id="players-count" style="margin-top: 20px; color: var(--accent-blue);">عدد اللاعبين: 0</h2>
            </div>
            
            <div class="small-qr-box">
                <p>باركود المُقدم (الكنترول)</p>
                <div id="qrcode-admin"></div>
            </div>
        </div>

        <div id="host-game-area">
            <h1 id="host-title" style="font-size: 3rem; color: var(--accent-blue);">جاري اللعب...</h1>
            <div id="answers-container" class="answers-grid"></div>
        </div>
    </div>

    <!-- ==================== 2. شاشة اللاعب (Player) ==================== -->
    <div id="player-view" class="view-container">
        <div class="mobile-card" id="player-login">
            <h2>سجل اسمك يالذيب</h2>
            <input type="text" id="player-name" placeholder="اسمك..." autocomplete="off">
            <button onclick="joinGame()">دخول</button>
        </div>

        <div class="mobile-card" id="player-waiting" style="display: none;">
            <h2 class="status-msg">انتظر المقدم يبدأ الجولة...</h2>
        </div>

        <div class="mobile-card" id="player-playing" style="display: none;">
            <h2 style="color: var(--accent-pink);">سؤالك هو:</h2>
            <h3 id="player-question" style="font-size: 1.5rem; margin-bottom: 20px;">-</h3>
            <input type="text" id="player-answer" placeholder="اكتب إجابتك هنا..." autocomplete="off">
            <button onclick="submitAnswer()">إرسال الإجابة</button>
        </div>
    </div>

    <!-- ==================== 3. شاشة المُقدم (Admin) ==================== -->
    <div id="admin-view" class="view-container">
        <div class="mobile-card">
            <h2>كنترول اللعبة 🎛️</h2>
            
            <div id="admin-setup">
                <input type="text" id="q-normal" placeholder="سؤال الأغلبية (مثال: أفضل سيارة؟)">
                <input type="text" id="q-imposter" placeholder="سؤال المتسلل (مثال: أسوأ سيارة؟)">
                <button onclick="startRound()">إرسال وبدء الجولة</button>
            </div>

            <div id="admin-controls" style="display: none; margin-top: 20px;">
                <p class="status-msg">اللاعبين يجاوبون الآن...</p>
                <button class="alt-btn" onclick="revealAnswers()">إظهار الإجابات على الشاشة</button>
                <button onclick="newRound()" style="margin-top: 15px;">جولة جديدة</button>
            </div>
        </div>
    </div>


    <!-- ==================== Firebase & Game Logic ==================== -->
    <script type="module">
        // استيراد مكتبات Firebase (Modular V9)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, update, remove, push } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // إعدادات الفايربيس (من الصورة المرفقة)
        const firebaseConfig = {
            apiKey: "AIzaSyDh4v9gRCICA_XRCJXsDpbtCySYAoFsfhk",
            authDomain: "bagera-word.firebaseapp.com",
            databaseURL: "https://bagera-word-default-rtdb.firebaseio.com",
            projectId: "bagera-word",
            storageBucket: "bagera-word.firebasestorage.app",
            messagingSenderId: "53001885470",
            appId: "1:53001885470:web:c6649f9f259824f747db0f"
        };

        // تهيئة التطبيق
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const gameRef = ref(db, 'imposter_game');

        // تحديد دور المستخدم من الرابط (host, player, admin)
        const urlParams = new URLSearchParams(window.location.search);
        const role = urlParams.get('role') || 'host';

        // المتغيرات المحلية
        let myPlayerId = localStorage.getItem('imposterPlayerId') || null;
        let playersData = {};
        let gameState = 'lobby';

        // ==================== إعدادات الواجهة بناءً على الدور ====================
        document.getElementById('host-view').style.display = (role === 'host') ? 'flex' : 'none';
        document.getElementById('player-view').style.display = (role === 'player') ? 'flex' : 'none';
        document.getElementById('admin-view').style.display = (role === 'admin') ? 'flex' : 'none';

        // ==================== منطق الشاشة الرئيسية (Host) ====================
        window.startHost = function() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('qr-container').style.display = 'block';

            // تصفير قاعدة البيانات لبداية جديدة
            set(gameRef, { state: 'lobby', imposterId: '', qNormal: '', qImposter: '' });
            remove(ref(db, 'imposter_game/players'));

            // توليد الباركود
            const baseUrl = window.location.origin + window.location.pathname;
            new QRCode(document.getElementById("qrcode-players"), { text: baseUrl + "?role=player", width: 300, height: 300, colorDark: "#000", colorLight: "#fff" });
            new QRCode(document.getElementById("qrcode-admin"), { text: baseUrl + "?role=admin", width: 120, height: 120, colorDark: "#000", colorLight: "#fff" });
        }

        // ==================== منطق اللاعب (Player) ====================
        window.joinGame = function() {
            const name = document.getElementById('player-name').value.trim();
            if(!name) return alert("اكتب اسمك أولاً!");

            const newPlayerRef = push(ref(db, 'imposter_game/players'));
            myPlayerId = newPlayerRef.key;
            localStorage.setItem('imposterPlayerId', myPlayerId);

            set(newPlayerRef, { name: name, answer: '' });

            document.getElementById('player-login').style.display = 'none';
            document.getElementById('player-waiting').style.display = 'block';
        }

        window.submitAnswer = function() {
            const answer = document.getElementById('player-answer').value.trim();
            if(!answer) return alert("اكتب إجابتك!");
            
            update(ref(db, `imposter_game/players/${myPlayerId}`), { answer: answer });
            
            document.getElementById('player-playing').style.display = 'none';
            document.getElementById('player-waiting').style.display = 'block';
            document.querySelector('#player-waiting .status-msg').innerText = "تم الإرسال! راقب الشاشة الرئيسية 👀";
        }

        // ==================== منطق المُقدم (Admin) ====================
        window.startRound = function() {
            const qN = document.getElementById('q-normal').value.trim();
            const qI = document.getElementById('q-imposter').value.trim();
            
            if(!qN || !qI) return alert("اكتب السؤالين أولاً!");

            const playerIds = Object.keys(playersData);
            if(playerIds.length < 3) return alert("تحتاج 3 لاعبين على الأقل لبدء اللعبة!");

            // اختيار متسلل عشوائي
            const randomImposter = playerIds[Math.floor(Math.random() * playerIds.length)];

            // مسح إجابات الجولة السابقة
            playerIds.forEach(id => { update(ref(db, `imposter_game/players/${id}`), { answer: '' }); });

            // تحديث حالة اللعبة
            update(gameRef, {
                state: 'playing',
                qNormal: qN,
                qImposter: qI,
                imposterId: randomImposter
            });

            document.getElementById('admin-setup').style.display = 'none';
            document.getElementById('admin-controls').style.display = 'block';
        }

        window.revealAnswers = function() { update(gameRef, { state: 'revealing' }); }
        
        window.newRound = function() {
            update(gameRef, { state: 'lobby' });
            document.getElementById('admin-setup').style.display = 'block';
            document.getElementById('admin-controls').style.display = 'none';
            document.getElementById('q-normal').value = '';
            document.getElementById('q-imposter').value = '';
        }

        // ==================== الاستماع لتحديثات قاعدة البيانات للجميع ====================
        onValue(gameRef, (snapshot) => {
            const data = snapshot.val();
            if (!data) return;
            
            gameState = data.state || 'lobby';
            playersData = data.players || {};
            const pCount = Object.keys(playersData).length;

            // تحديث الشاشة الرئيسية (Host)
            if (role === 'host') {
                document.getElementById('players-count').innerText = `عدد اللاعبين: ${pCount}`;
                
                if (gameState === 'lobby') {
                    document.getElementById('qr-container').style.display = 'block';
                    document.getElementById('host-game-area').style.display = 'none';
                } 
                else if (gameState === 'playing') {
                    document.getElementById('qr-container').style.display = 'none';
                    document.getElementById('host-game-area').style.display = 'block';
                    document.getElementById('host-title').innerText = "اللاعبين قاعدين يجاوبون، استعدوا! ⏳";
                    document.getElementById('answers-container').innerHTML = ''; // إخفاء الإجابات
                }
                else if (gameState === 'revealing') {
                    document.getElementById('host-title').innerText = "مين فيهم المتسلل؟ 🤔";
                    const container = document.getElementById('answers-container');
                    container.innerHTML = '';
                    
                    // خلط أماكن الإجابات عشان ما ينكشف المتسلل من مكانه
                    let shuffledIds = Object.keys(playersData).sort(() => Math.random() - 0.5);
                    
                    shuffledIds.forEach(id => {
                        const pData = playersData[id];
                        if(pData.answer) {
                            container.innerHTML += `
                                <div class="answer-card">
                                    <span class="player-name-badge">${pData.name}</span>
                                    <span>${pData.answer}</span>
                                </div>
                            `;
                        }
                    });
                }
            }

            // تحديث شاشة اللاعب (Player)
            if (role === 'player' && myPlayerId) {
                if (gameState === 'lobby') {
                    document.getElementById('player-playing').style.display = 'none';
                    document.getElementById('player-waiting').style.display = 'block';
                    document.querySelector('#player-waiting .status-msg').innerText = "انتظر المقدم يبدأ الجولة...";
                    document.getElementById('player-answer').value = ''; // تصفير الحقل
                } 
                else if (gameState === 'playing' && playersData[myPlayerId]?.answer === '') {
                    document.getElementById('player-waiting').style.display = 'none';
                    document.getElementById('player-playing').style.display = 'block';
                    
                    // تحديد السؤال (هل هو متسلل أم لا؟)
                    if (myPlayerId === data.imposterId) {
                        document.getElementById('player-question').innerText = data.qImposter;
                    } else {
                        document.getElementById('player-question').innerText = data.qNormal;
                    }
                }
            }
        });
    </script>
</body>
</html>
